name: Build Russian XMLTV

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */12 * * *"
  push:
    paths:
      - "channels.xml"
      - ".github/workflows/build-epg.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository without external Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Check Node.js
        run: |
          node --version
          npm --version

      - name: Get the official EPG grabber
        run: git clone --depth 1 https://github.com/iptv-org/epg.git epg-engine

      - name: Install grabber dependencies
        working-directory: epg-engine
        run: npm ci

      - name: Patch Mail.ru scraper for current POST-only schedule endpoint
        working-directory: epg-engine
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("sites/tv.mail.ru/tv.mail.ru.config.js")
          source = path.read_text()
          request_old = "  request: {\\n    cache: {"
          request_new = "  request: {\\n    method: 'POST',\\n    cache: {"
          fetch_old = "await axios[m](url, { headers })"
          fetch_new = "await axios.post(url, {}, { headers })"
          if request_old not in source:
              raise SystemExit("Mail.ru request block changed; refusing an unverified patch")
          if fetch_old not in source:
              raise SystemExit("Mail.ru URL probe changed; refusing an unverified patch")
          source = source.replace(request_old, request_new, 1)
          source = source.replace(fetch_old, fetch_new, 1)
          path.write_text(source)
          print("Mail.ru scraper patched: POST request + POST URL probe")
          PY

      - name: Generate XMLTV from mapped sources
        working-directory: epg-engine
        run: |
          mkdir -p ../public
          npm run grab -- --channels=../channels.xml --output=../public/epg.xml --days=2 --maxConnections=1

      - name: Validate playlist ID matching and programme records
        run: |
          python - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from urllib.request import urlopen

          guide = ET.parse("public/epg.xml").getroot()
          guide_ids = {node.get("id") for node in guide.findall("channel") if node.get("id")}
          programmes = guide.findall("programme")
          programme_ids = {node.get("channel") for node in programmes if node.get("channel")}

          with urlopen("https://iptv-org.github.io/iptv/languages/rus.m3u", timeout=60) as response:
              playlist = response.read().decode("utf-8", errors="replace")

          playlist_ids = set(re.findall(r'tvg-id="([^"]+)"', playlist))
          matched = playlist_ids & guide_ids
          with_programmes = playlist_ids & programme_ids

          print(f"Playlist tvg-id values: {len(playlist_ids)}")
          print(f"XMLTV channel IDs: {len(guide_ids)}")
          print(f"Exact playlist/XMLTV matches: {len(matched)}")
          print(f"Matched channels with programmes: {len(with_programmes)}")
          print(f"Programme records: {len(programmes)}")

          if len(playlist_ids) == 0 or len(matched) < 20 or len(with_programmes) < 10 or len(programmes) < 50:
              raise SystemExit("Validation failed: refusing to publish an empty or badly mismatched EPG.")
          PY

      - name: Compress guide
        run: gzip -9 -k public/epg.xml

      - name: Publish guide to data branch without external Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -C public init -b data
          git -C public config user.name "github-actions[bot]"
          git -C public config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C public add epg.xml epg.xml.gz
          git -C public commit -m "Update Russian XMLTV guide"
          git -C public remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C public push --force origin data
